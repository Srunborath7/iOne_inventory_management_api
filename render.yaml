services:
  # FastAPI Web Service on Render
  - type: web
    name: inventory-management-api
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        value: "*"
      - key: AUTO_MIGRATE
        value: "false"
      - key: DATABASE_ECHO
        value: "false"
      - key: ENVIRONMENT
        value: "production"

